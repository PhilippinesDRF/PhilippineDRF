<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Philippines TC Dashboard</title>

<style>
    :root {
        --text: #1a1a1a;
        --muted: #6b6b6b;
        --border: #dcdcdc;
        --bg: #ffffff;
        --row-alt: #fafafa;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    /* Centered narrow layout */
    .main {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px;
    }

    /* Section titles */
    h1 {
        font-size: 1.8rem;
        margin-bottom: 10px;
        font-weight: bold;
    }

    h2 {
        font-size: 1.3rem;
        margin-top: 40px;
        margin-bottom: 12px;
        font-weight: bold;
    }

    .subtext {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 25px;
    }

    /* Tables */
    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
        margin-bottom: 30px;
    }

    table th {
        text-align: left;
        padding: 8px;
        border-bottom: 2px solid var(--border);
        font-weight: bold;
        background: #f7f7f7;
    }

    table td {
        padding: 8px;
        border-bottom: 1px solid var(--border);
    }

    table tr:nth-child(even) td {
        background: var(--row-alt);
    }

    /* Light grouping labels (optional) */
    .group-label {
        font-weight: bold;
        margin-top: 25px;
        margin-bottom: 8px;
        color: var(--text);
    }
</style>

</head>

<body>
<div class="main">

    <h1>Philippines Tropical Cyclone Dashboard</h1>
    <div class="subtext">Live data from the model output sheet</div>

    <h2>Trigger Probability & Allocations</h2>
    <table id="data-table">
        <thead></thead>
        <tbody></tbody>
    </table>

    <h2>Model Status</h2>
    <div id="model-status"></div>

    <h2>CP Allocation</h2>
    <table id="cp-table"></table>

    <h2>Risk Pool (Total) Allocation</h2>
    <div id="risk-pool"></div>

</div>

<!-- Your JS goes here -->
</body>



<script>
// Your published CSV URL
const sheetURL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYBWqeD1x20Y2mtyRLnkkpSM6anZjeIXmNThjQeM1QcIbv1sEkJy2mCeL_PcqBJYw3_dXSLnVX_arh/pub?gid=1336158865&single=true&output=csv";

// A robust CSV parser that handles commas, quotes, and line breaks
function parseCSV(text) {
    const rows = [];
    let current = [];
    let value = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && insideQuotes && next === '"') {
            value += '"';
            i++;
        } else if (char === '"') {
            insideQuotes = !insideQuotes;
        } else if (char === ',' && !insideQuotes) {
            current.push(value);
            value = "";
        } else if ((char === '\n' || char === '\r') && !insideQuotes) {
            if (value || current.length) {
                current.push(value);
                rows.push(current);
                current = [];
                value = "";
            }
        } else {
            value += char;
        }
    }

    if (value || current.length) {
        current.push(value);
        rows.push(current);
    }

    const headers = rows[0];
    return rows.slice(1).map(row => {
        let obj = {};
        headers.forEach((h, i) => obj[h] = row[i] || "");
        return obj;
    });
}

// Render table
// Build Model Status table
function populateModelStatus(data) {
    const container = document.getElementById("model-status");
    container.innerHTML = "";

    const table = document.createElement("table");
    table.className = "small-table";

    table.innerHTML = `
        <tr>
            <th>Province</th>
            <th>Status</th>
        </tr>
    `;

    data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${row["Province"]}</td>
            <td>${row["Model Status"]}</td>
        `;
        table.appendChild(tr);
    });

    container.appendChild(table);
}

// Build CP Allocation table
function populateCPAllocation(data) {
    const container = document.getElementById("cp-table");
    container.innerHTML = `
        <tr>
            <th>Province</th>
            <th>AA</th>
            <th>ER</th>
            <th>Total</th>
        </tr>
    `;

    data.forEach(row => {
        const aa = row["CP Allocation AA"] || row["AA"] || row["CP Allocation"];
        const er = row["CP Allocation ER"] || row["ER"];
        const total = row["CP Allocation Total"] || row["Total"] || row["CP Allocation (Total)"];

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${row["Province"]}</td>
            <td>${aa || 0}</td>
            <td>${er || 0}</td>
            <td>${total || 0}</td>
        `;
        container.appendChild(tr);
    });
}

// Build Risk Pool Allocation table
function populateRiskPool(data) {
    const container = document.getElementById("risk-pool");
    container.innerHTML = "";

    const table = document.createElement("table");
    table.className = "small-table";

    table.innerHTML = `
        <tr>
            <th>Province</th>
            <th>Risk Pool Allocation</th>
        </tr>
    `;

    data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${row["Province"]}</td>
            <td>${row["Risk Pool (Total) Allocation"]}</td>
        `;
        table.appendChild(tr);
    });

    container.appendChild(table);
}


// Load Google Sheet CSV
async function loadSheet() {
    try {
        const response = await fetch(sheetURL);
        const text = await response.text();
        const data = parseCSV(text);

        // Main trigger table
        renderTable(data);

        // New tables
        populateModelStatus(data);
        populateCPAllocation(data);
        populateRiskPool(data);

        document.getElementById("status").innerText = "Loaded successfully";
    } catch (err) {
        document.getElementById("status").innerText = "Error loading data";
        console.error(err);
    }
}

loadSheet();
</script>

</body>
</html>
