<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Philippines TC Dashboard</title>

<style>
    /* ------------------------------
       COLOUR + THEME
    ------------------------------ */
    :root {
        --text: #1a1a1a;
        --muted: #6b6b6b;
        --border: #e2e2e2;
        --bg: #ffffff;

        --risk-very-high: #b30000;
        --risk-high: #b58900;
        --risk-moderate: #2f7d32;

        --status-high: #b58900;
        --status-no: #555;
        --status-moderate: #2f7d32;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    /* ------------------------------
       LAYOUT
    ------------------------------ */
    .main {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px;
    }

    h1 {
        font-size: 1.8rem;
        margin-bottom: 8px;
        font-weight: bold;
    }

    .subtext {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 30px;
    }

    /* ------------------------------
       TABLE (Pakistan-modern style)
    ------------------------------ */
    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
        margin-bottom: 40px;
    }

    th {
        text-align: left;
        padding: 10px 6px;
        border-bottom: 2px solid var(--border);
        font-weight: bold;
        background: #fafafa;
    }

    td {
        padding: 10px 6px;
        border-bottom: 1px solid var(--border);
    }

    /* No alternating shading — Pakistan style */
    tr:nth-child(even) td {
        background: none;
    }

    /* ------------------------------
       COLOUR ACCENTS
    ------------------------------ */
    .status-high {
        color: var(--status-high);
        font-weight: bold;
    }

    .status-no {
        color: var(--status-no);
        font-weight: bold;
    }

    .status-moderate {
        color: var(--status-moderate);
        font-weight: bold;
    }

    .risk-very-high {
        color: var(--risk-very-high);
        font-weight: bold;
    }

    .risk-high {
        color: var(--risk-high);
        font-weight: bold;
    }

    .risk-moderate {
        color: var(--risk-moderate);
        font-weight: bold;
    }
</style>

</head>

<body>
<div class="main">

    <h1>Philippines Tropical Cyclone Dashboard</h1>
    <div class="subtext">Live data from the model output sheet</div>

    <!-- Single clean table -->
    <table id="data-table">
        <thead></thead>
        <tbody></tbody>
    </table>

</div>

<script>
/* ----------------------------------------------------
   CSV SOURCE
---------------------------------------------------- */
const sheetURL =
  "https://docs.google.com/spreadsheets/d/1zWwRt7ZK5coRiZ4vqullTUYXQWE08Mxo_TAxregjngw/export?format=csv&gid=1336158865";

/* ----------------------------------------------------
   CSV PARSER
---------------------------------------------------- */
function parseCSV(text) {
    const rows = text.trim().split("\n").map(r => r.split(","));
    const headers = rows[0];
    return rows.slice(1).map(row => {
        let obj = {};
        headers.forEach((h, i) => obj[h.trim()] = row[i]?.trim());
        return obj;
    });
}

/* ----------------------------------------------------
   RENDER TABLE (Pakistan-modern)
---------------------------------------------------- */
function renderTable(data) {
    const thead = document.querySelector("#data-table thead");
    const tbody = document.querySelector("#data-table tbody");

    thead.innerHTML = "";
    tbody.innerHTML = "";

    /* Build header row */
    const headerRow = document.createElement("tr");
    Object.keys(data[0]).forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);

    /* Build data rows */
    data.forEach(row => {
        const tr = document.createElement("tr");

        Object.entries(row).forEach(([key, value]) => {
            const td = document.createElement("td");

            /* Status colouring */
            if (key === "Model Status") {
                if (value.includes("MODERATE")) td.className = "status-moderate";
                else if (value.includes("HIGH")) td.className = "status-high";
                else td.className = "status-no";
            }

            /* Risk Pool colouring */
            if (key === "Risk Pool (Total) Allocation") {
                if (value.includes("Very High")) td.className = "risk-very-high";
                else if (value.includes("High")) td.className = "risk-high";
                else td.className = "risk-moderate";
            }

            td.textContent = value;
            tr.appendChild(td);
        });

        tbody.appendChild(tr);
    });
}

/* ----------------------------------------------------
   LOAD SHEET
---------------------------------------------------- */
async function loadSheet() {
    try {
        const response = await fetch(sheetURL);
        const text = await response.text();
        const data = parseCSV(text);
        renderTable(data);
    } catch (err) {
        console.error("Error loading sheet:", err);
    }
}

loadSheet();
</script>

</body>
</html>
