<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Philippines TC Dashboard</title>

<style>
    :root {
        --bg: #f3f4f6;
        --card: #ffffff;
        --border: #e5e7eb;
        --text: #111827;
        --muted: #6b7280;
        --accent: #005f73;
        --accent-light: #e0f2f1;
        --shadow: 0 4px 12px rgba(0,0,0,0.08);
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    /* Header */
    .header {
        background: var(--accent);
        color: white;
        padding: 26px 40px;
        font-size: 1.8rem;
        font-weight: bold;
    }

    .subheader {
        padding: 0 40px 20px;
        color: #d9f3ff;
        font-size: 1rem;
    }

    /* Layout */
    .main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 30px 40px;
    }

    .card {
        background: var(--card);
        padding: 24px 28px;
        border-radius: 14px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        margin-bottom: 28px;
    }

    .card h3 {
        margin: 0 0 10px;
        font-size: 1.3rem;
        font-weight: bold;
    }

    .card-sub {
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 18px;
    }

    /* Table styling */
    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 0.9rem;
        border-radius: 8px;
        overflow: hidden;
    }

    table th {
        background: var(--accent-light);
        padding: 10px;
        border-bottom: 2px solid var(--border);
        font-weight: bold;
        text-align: center;
    }

    table td {
        padding: 10px;
        border-bottom: 1px solid var(--border);
        text-align: center;
    }

    table tr:nth-child(even) td {
        background: #fafafa;
    }

    table tr:hover td {
        background: #eef7f7;
    }

    /* Section titles inside cards */
    .section-title {
        font-weight: bold;
        margin: 20px 0 10px;
        font-size: 1.1rem;
        color: var(--accent);
    }

    /* Small tables */
    .small-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-size: 0.9rem;
    }

    .small-table th, .small-table td {
        padding: 8px;
        border: 1px solid var(--border);
        text-align: center;
    }

    .updated-bar {
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 20px;
    }
</style>
</head>

<body>

<div class="header">Philippines Tropical Cyclone Dashboard</div>
<div class="subheader">START Network · Clean Modern Layout</div>

<div class="main">

    <div class="updated-bar">
        <strong>Date Updated:</strong> Auto-filled from sheet (optional)  
    </div>

    <!-- Trigger Table -->
    <div class="card">
        <h3>Trigger Probability & Allocations</h3>
        <div class="card-sub">Live data from the model output sheet.</div>

        <div style="overflow-x:auto;">
            <table id="data-table">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Model Status -->
    <div class="card">
        <h3>Model Status</h3>
        <div id="model-status"></div>
    </div>

    <!-- CP Allocation -->
    <div class="card">
        <h3>CP Allocation</h3>
        <table class="small-table" id="cp-table"></table>
    </div>

    <!-- Risk Pool -->
    <div class="card">
        <h3>Risk Pool Allocation</h3>
        <div id="risk-pool"></div>
    </div>

</div>

<script>
    <!-- keep your existing JavaScript here exactly as it is -->
</script>

</body>


<script>
// Your published CSV URL
const sheetURL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYBWqeD1x20Y2mtyRLnkkpSM6anZjeIXmNThjQeM1QcIbv1sEkJy2mCeL_PcqBJYw3_dXSLnVX_arh/pub?gid=1336158865&single=true&output=csv";

// A robust CSV parser that handles commas, quotes, and line breaks
function parseCSV(text) {
    const rows = [];
    let current = [];
    let value = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && insideQuotes && next === '"') {
            value += '"';
            i++;
        } else if (char === '"') {
            insideQuotes = !insideQuotes;
        } else if (char === ',' && !insideQuotes) {
            current.push(value);
            value = "";
        } else if ((char === '\n' || char === '\r') && !insideQuotes) {
            if (value || current.length) {
                current.push(value);
                rows.push(current);
                current = [];
                value = "";
            }
        } else {
            value += char;
        }
    }

    if (value || current.length) {
        current.push(value);
        rows.push(current);
    }

    const headers = rows[0];
    return rows.slice(1).map(row => {
        let obj = {};
        headers.forEach((h, i) => obj[h] = row[i] || "");
        return obj;
    });
}

// Render table
// Build Model Status table
function populateModelStatus(data) {
    const container = document.getElementById("model-status");
    container.innerHTML = "";

    const table = document.createElement("table");
    table.className = "small-table";

    table.innerHTML = `
        <tr>
            <th>Province</th>
            <th>Status</th>
        </tr>
    `;

    data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${row["Province"]}</td>
            <td>${row["Model Status"]}</td>
        `;
        table.appendChild(tr);
    });

    container.appendChild(table);
}

// Build CP Allocation table
function populateCPAllocation(data) {
    const container = document.getElementById("cp-table");
    container.innerHTML = `
        <tr>
            <th>Province</th>
            <th>AA</th>
            <th>ER</th>
            <th>Total</th>
        </tr>
    `;

    data.forEach(row => {
        const aa = row["CP Allocation AA"] || row["AA"] || row["CP Allocation"];
        const er = row["CP Allocation ER"] || row["ER"];
        const total = row["CP Allocation Total"] || row["Total"] || row["CP Allocation (Total)"];

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${row["Province"]}</td>
            <td>${aa || 0}</td>
            <td>${er || 0}</td>
            <td>${total || 0}</td>
        `;
        container.appendChild(tr);
    });
}

// Build Risk Pool Allocation table
function populateRiskPool(data) {
    const container = document.getElementById("risk-pool");
    container.innerHTML = "";

    const table = document.createElement("table");
    table.className = "small-table";

    table.innerHTML = `
        <tr>
            <th>Province</th>
            <th>Risk Pool Allocation</th>
        </tr>
    `;

    data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${row["Province"]}</td>
            <td>${row["Risk Pool (Total) Allocation"]}</td>
        `;
        table.appendChild(tr);
    });

    container.appendChild(table);
}


// Load Google Sheet CSV
async function loadSheet() {
    try {
        const response = await fetch(sheetURL);
        const text = await response.text();
        const data = parseCSV(text);

        // Main trigger table
        renderTable(data);

        // New tables
        populateModelStatus(data);
        populateCPAllocation(data);
        populateRiskPool(data);

        document.getElementById("status").innerText = "Loaded successfully";
    } catch (err) {
        document.getElementById("status").innerText = "Error loading data";
        console.error(err);
    }
}

loadSheet();
</script>

</body>
</html>
