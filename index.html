<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Philippines TC Dashboard</title>

<style>
    :root {
        --text: #1a1a1a;
        --muted: #6b6b6b;
        --border: #dcdcdc;
        --bg: #ffffff;
        --row-alt: #fafafa;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    /* Centered narrow layout */
    .main {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px;
    }

    /* Section titles */
    h1 {
        font-size: 1.8rem;
        margin-bottom: 10px;
        font-weight: bold;
    }

    h2 {
        font-size: 1.3rem;
        margin-top: 40px;
        margin-bottom: 12px;
        font-weight: bold;
    }

    .subtext {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 25px;
    }

    /* Tables */
    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
        margin-bottom: 30px;
    }

    table th {
        text-align: left;
        padding: 8px;
        border-bottom: 2px solid var(--border);
        font-weight: bold;
        background: #f7f7f7;
    }

    table td {
        padding: 8px;
        border-bottom: 1px solid var(--border);
    }

    table tr:nth-child(even) td {
        background: var(--row-alt);
  
    }

    /* Group labels */
.group-label {
    font-weight: bold;
    margin-top: 25px;
    margin-bottom: 6px;
    font-size: 1rem;
    color: #333;
}

/* Status colours */
.status-high {
    color: #b58900;
    font-weight: bold;
}

.status-no {
    color: #555;
    font-weight: bold;
}

/* Risk pool colours */
.risk-very-high {
    color: #b30000;
    font-weight: bold;
}

.risk-high {
    color: #b58900;
    font-weight: bold;
}

.risk-moderate {
    color: #2f7d32;
    font-weight: bold;
}

</style>

</head>

<body>
<div class="main">

    <h1>Philippines Tropical Cyclone Dashboard</h1>
    <div class="subtext">Live data from the model output sheet</div>

    <h2>Trigger Probability & Allocations</h2>
    <table id="data-table">
        <thead></thead>
        <tbody></tbody>
    </table>

    <h2>Model Status</h2>
    <div id="model-status"></div>

    <h2>CP Allocation</h2>
    <table id="cp-table"></table>

    <h2>Risk Pool (Total) Allocation</h2>
    <div id="risk-pool"></div>

</div>

<!-- Your JS goes here -->

<script>
// Google Sheet CSV export link
const sheetURL = "https://docs.google.com/spreadsheets/d/1zWwRt7ZK5coRiZ4vqullTUYXQWE08Mxo_TAxregjngw/edit?gid=1336158865#gid=1336158865";

// Parse CSV into array of objects
function parseCSV(text) {
    const rows = text.trim().split("\n").map(r => r.split(","));
    const headers = rows[0];
    return rows.slice(1).map(row => {
        let obj = {};
        headers.forEach((h, i) => obj[h.trim()] = row[i]?.trim());
        return obj;
    });
}

// Group rows by province
function groupByProvince(data) {
    const groups = {};
    data.forEach(row => {
        const p = row["Province"];
        if (!groups[p]) groups[p] = [];
        groups[p].push(row);
    });
    return groups;
}

// -------------------------------
// MAIN TRIGGER TABLE
// -------------------------------
function renderTable(data) {
    const thead = document.querySelector("#data-table thead");
    const tbody = document.querySelector("#data-table tbody");

    thead.innerHTML = "";
    tbody.innerHTML = "";

    const headerRow = document.createElement("tr");
    Object.keys(data[0]).forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);

    const groups = groupByProvince(data);

    Object.keys(groups).forEach(province => {
        // Province label row
        const labelRow = document.createElement("tr");
        const labelCell = document.createElement("td");
        labelCell.colSpan = Object.keys(data[0]).length;
        labelCell.className = "group-label";
        labelCell.textContent = province;
        labelRow.appendChild(labelCell);
        tbody.appendChild(labelRow);

        // Data rows
        groups[province].forEach(row => {
            const tr = document.createElement("tr");
            Object.values(row).forEach(v => {
                const td = document.createElement("td");
                td.textContent = v;
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    });
}

// -------------------------------
// MODEL STATUS TABLE
// -------------------------------
function populateModelStatus(data) {
    const container = document.getElementById("model-status");
    container.innerHTML = "";

    const table = document.createElement("table");
    table.innerHTML = `
        <tr>
            <th>Province</th>
            <th>Status</th>
        </tr>
    `;

    const groups = groupByProvince(data);

    Object.keys(groups).forEach(province => {
        const status = groups[province][0]["Model Status"];

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${province}</td>
            <td class="${status === "HIGH" ? "status-high" : "status-no"}">${status}</td>
        `;
        table.appendChild(tr);
    });

    container.appendChild(table);
}

// -------------------------------
// CP ALLOCATION TABLE
// -------------------------------
function populateCPAllocation(data) {
    const table = document.getElementById("cp-table");
    table.innerHTML = `
        <tr>
            <th>Province</th>
            <th>AA</th>
            <th>ER</th>
            <th>Total</th>
        </tr>
    `;

    const groups = groupByProvince(data);

    Object.keys(groups).forEach(province => {
        let aa = 0, er = 0, total = 0;

        groups[province].forEach(row => {
            aa += Number(row["CP Allocation AA"] || 0);
            er += Number(row["CP Allocation ER"] || 0);
            total += Number(row["CP Allocation Total"] || 0);
        });

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${province}</td>
            <td>£${aa.toLocaleString()}</td>
            <td>£${er.toLocaleString()}</td>
            <td>£${total.toLocaleString()}</td>
        `;
        table.appendChild(tr);
    });
}

// -------------------------------
// RISK POOL TABLE
// -------------------------------
function populateRiskPool(data) {
    const container = document.getElementById("risk-pool");
    container.innerHTML = "";

    const table = document.createElement("table");
    table.innerHTML = `
        <tr>
            <th>Province</th>
            <th>Risk Pool Allocation</th>
        </tr>
    `;

    const groups = groupByProvince(data);

    Object.keys(groups).forEach(province => {
        const value = groups[province][0]["Risk Pool (Total) Allocation"];

        // Determine category
        let cls = "risk-moderate";
        if (value.includes("Very High")) cls = "risk-very-high";
        else if (value.includes("High")) cls = "risk-high";

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${province}</td>
            <td class="${cls}">${value}</td>
        `;
        table.appendChild(tr);
    });

    container.appendChild(table);
}

// -------------------------------
// LOAD EVERYTHING
// -------------------------------
async function loadSheet() {
    try {
        const response = await fetch(sheetURL);
        const text = await response.text();
        const data = parseCSV(text);

        renderTable(data);
        populateModelStatus(data);
        populateCPAllocation(data);
        populateRiskPool(data);

    } catch (err) {
        console.error("Error loading sheet:", err);
    }
}

loadSheet();

</script>

</body>
</html>
